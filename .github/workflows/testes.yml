name: Testes automatizados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências de teste
        run: python -m pip install -r backend/requirements-dev.txt -c backend/constraints-ci.txt

      - name: Registrar ambiente e verificar dependências
        run: |
          python --version
          python -m pip check
          python -m pip freeze --all > dependencias-instaladas.txt

      - name: Executar testes sem dados reservados
        run: python -m pytest backend/tests -q -rs

      - name: Arquivar dependências instaladas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencias-${{ matrix.os }}
          path: dependencias-instaladas.txt
          if-no-files-found: warn
