<title id="a">Fluxo de funcionamento do SentiVis</title><desc id="b">Léxicos de terceiros são auditados, passam por curadoria e são utilizados por métodos experimentais e uma interface exploratória. A avaliação reservada permanece bloqueada.</desc>
